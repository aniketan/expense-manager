services:
  app:
    build: .
    image: expense-manager:local
    container_name: expense-manager
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      # Read from your shell or from .env next to this file. Required to log in.
      APP_LOGIN_PASSWORD: ${APP_LOGIN_PASSWORD:-}
      APP_URL: http://localhost:${APP_PORT:-8080}
      APP_DEBUG: ${APP_DEBUG:-false}
      # The AI chat reaches Ollama running on your machine, not inside the container.
      OLLAMA_URL: ${DOCKER_OLLAMA_URL:-http://host.docker.internal:11434}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      AI_MODEL: ${AI_MODEL:-qwen3.5:9b}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # SQLite database and app key; survives rebuilds. `docker compose down -v` erases it.
      - expense-data:/data
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost/up') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

volumes:
  expense-data:
