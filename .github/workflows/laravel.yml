name: Laravel CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: laravel-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: dom, fileinfo, mbstring, pdo_sqlite, sqlite3
        coverage: none

    - name: Setup Node
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: npm

    - name: Prepare environment
      run: cp .env.example .env

    - name: Install PHP dependencies
      run: composer install --no-ansi --no-interaction --no-progress --prefer-dist

    - name: Check PHP formatting
      run: ./vendor/bin/pint --test

    - name: Install frontend dependencies
      run: npm ci --no-audit --no-fund

    - name: Lint frontend code
      run: npm run lint

    - name: Run frontend tests
      run: npm test

    - name: Build frontend assets
      run: npm run build

    - name: Generate application key
      run: php artisan key:generate

    - name: Prepare SQLite database
      run: |
        mkdir -p database
        touch database/database.sqlite

    - name: Run database migrations
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
      run: php artisan migrate --force

    - name: Run PHP tests
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
      run: composer test

  docker:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Build image
      run: docker build -t expense-manager:ci .

    - name: Boot and check health
      run: |
        docker run -d --name em -p 8080:80 -e APP_LOGIN_PASSWORD=ci-check expense-manager:ci
        for i in $(seq 1 30); do
          curl -fsS http://localhost:8080/up >/dev/null && break
          sleep 2
        done
        curl -fsS http://localhost:8080/up >/dev/null
        test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/transactions)" = "302"

    - name: Show container logs on failure
      if: failure()
      run: docker logs em
